[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hardplacer"
version = "0.1.0"
description = "Safe-anchor nonsmooth global placement extension"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "psutil>=5.9", "gpplacer>=0.1.0"]

[project.scripts]
hardplacer = "hardplacer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
