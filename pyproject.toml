[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-pareto-soft"
version = "0.2.0"
description = "Adaptive Pareto global-placement experiment controller"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "plotly>=5.20"]

[project.optional-dependencies]
spectral = ["scipy>=1.11"]
proxy = ["scikit-learn>=1.4"]

[project.scripts]
adaptive-pareto = "adaptive_pareto.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
